server {
    listen 80;
    server_name opendrone.io www.opendrone.io;
    client_max_body_size 100M;

    location / {
        root /var/www/opendrone/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /static/ {
        alias /var/www/opendrone/backend/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /var/www/opendrone/backend/media/;
        expires 7d;
    }
}

server {
    listen 80 default_server;
    # Catch-all: l'IP dell'EC2 puo' cambiare (Elastic IP / migrazione).
    # Quando avremo dominio + SSL si aggiungera' un blocco listen 443
    # con server_name esplicito e redirect 80 -> 443.
    server_name _;

    client_max_body_size 50M;

    # ─── Security headers (validi anche in HTTP, hardening base) ───
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)" always;
    # NB: HSTS NON impostato finche' non c'e' HTTPS (rischio brick).
    # NB: CSP gestita lato Django (django-csp) o lato Vercel (header in vercel.json).

    # /admin/ Django: in attesa di HTTPS, raccomandato bloccare o IP-restrict
    # qui sotto. Esempio (decommenta + sostituisci IP):
    # location /admin/ {
    #     allow <IP-CASA>;
    #     deny all;
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

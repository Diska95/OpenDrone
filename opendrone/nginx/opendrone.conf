# ─── HTTP → HTTPS redirect ────────────────────────────────────────
server {
    listen 80;
    server_name tuodominio.it www.tuodominio.it api.tuodominio.it;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Frontend (proxy a Vercel oppure file statici) ────────────────
server {
    listen 443 ssl;
    server_name tuodominio.it www.tuodominio.it;

    ssl_certificate     /etc/nginx/ssl/live/tuodominio.it/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/tuodominio.it/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Se usi Vercel, proxya lì. Altrimenti servi i file statici localmente.
    location / {
        proxy_pass https://tuoprogetto.vercel.app;
        proxy_set_header Host tuoprogetto.vercel.app;
        proxy_ssl_server_name on;
    }
}

# ─── Backend API ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.tuodominio.it;

    ssl_certificate     /etc/nginx/ssl/live/api.tuodominio.it/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/api.tuodominio.it/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
